server {
    listen 80;
    server_name _;

    # Uploaded product images, CMS banners, receipts, etc. can be
    # sizeable -- default nginx limit (1MB) would reject them.
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded media (product images, CMS banners, receipts) and
    # Django's collected static files (admin CSS, DRF browsable API,
    # Swagger UI) are read directly from the shared Docker volumes --
    # more efficient than proxying through Python, and correct
    # regardless of Django's own DEBUG setting (Django's urls.py only
    # serves MEDIA_URL itself when DEBUG=True, which this deployment
    # deliberately doesn't run with).
    location /media/ {
        alias /media_files/;
    }

    location /static/ {
        alias /static_files/;
    }

    # Everything Django/DRF owns: the actual API and Django's
    # built-in admin (renamed to /django-admin/ specifically so it
    # doesn't collide with the React app's own /admin/* routes).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the React SPA. try_files falls back to
    # index.html for any path react-router owns client-side (e.g.
    # /admin/login, /shop, /product/some-slug) so a hard refresh or a
    # shared link on those routes doesn't 404 at the web-server level.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
